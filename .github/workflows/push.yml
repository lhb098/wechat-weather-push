name: wechat-weather-push

on:
  schedule:
    - cron: '30 4 * * *'   # 北京时间 12:30
    - cron: '30 11 * * *'  # 北京时间 19:30
    - cron: '40 13 * * *'  # 北京时间 21:40
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 获取深圳天气并推送微信
        env:
          KEY: ${{ secrets.SERVERCHAN_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 push.py
